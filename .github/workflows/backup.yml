name: Encrypted backup and restore check
on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huddl-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huddl_restore
          POSTGRES_PASSWORD: local_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d huddl_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      BACKUP_DATABASE_URL: ${{ secrets.HUDDL_BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.HUDDL_BACKUP_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.HUDDL_BACKUP_BLOB_TOKEN }}
      SUPABASE_CA_CERT_B64: ${{ secrets.HUDDL_BACKUP_CA_B64 }}
      RESTORE_TEST_DATABASE_URL: postgresql://postgres:local_restore_test@127.0.0.1:5432/huddl_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: Make encrypted backup
        id: backup
        run: |
          export SUPABASE_CA_CERT="$(printf '%s' "$SUPABASE_CA_CERT_B64" | base64 --decode)"
          node scripts/backup-run.mjs create
      - name: Restore the uploaded backup in isolated PostgreSQL
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.pathname }}
        run: node scripts/backup-run.mjs verify
      - name: Remove backups outside retention
        run: node scripts/backup-run.mjs prune
      - name: Email backup failure alert
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.HUDDL_ALERT_BREVO_KEY }}
          ALERT_EMAIL: ${{ secrets.HUDDL_ALERT_EMAIL }}
        run: node scripts/send-alert.mjs 'Huddl backup or restore check failed'
