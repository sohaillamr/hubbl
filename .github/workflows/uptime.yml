name: Huddl availability monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: huddl-uptime
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and database health
        run: node scripts/health-check.mjs
      - name: Email failure or requested test
        if: failure() || inputs.test_alert == true
        env:
          BREVO_API_KEY: ${{ secrets.HUDDL_ALERT_BREVO_KEY }}
          ALERT_EMAIL: ${{ secrets.HUDDL_ALERT_EMAIL }}
        run: node scripts/send-alert.mjs 'Huddl availability alert'
